{% extends "web/base.html" %}
{% load i18n %}
{% block title %}{% translate "Change password" %}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{% translate "Change password" %}</h1>
<div class="card" style="max-width: 32rem">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "web/includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary">{% translate "Change password" %}</button>
      <a class="btn btn-link" href="{% url 'preferences' %}">{% translate "Cancel" %}</a>
    </form>
  </div>
</div>
{% endblock %}
