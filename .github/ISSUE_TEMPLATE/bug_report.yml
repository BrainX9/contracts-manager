name: Bug report
description: Something does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! You can write in English or German.
        Please remove passwords, tokens and personal data before you submit.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Include the exact error message if there is one.
      placeholder: |
        I saved a contract with the payment method "Visa" and got "Server Error (500)". I expected the contract to be saved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Optional. Shown in the sidebar for superusers and under Administration › System.
      placeholder: "0.11.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Output of `docker compose logs app worker --tail 100`, taken right after the error.
      render: shell
