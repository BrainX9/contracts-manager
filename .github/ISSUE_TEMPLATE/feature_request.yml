name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! A few sentences are enough. You can write in English or German.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should Contracts Manager do, and what would it help you with?
      placeholder: |
        I would like to filter the contract list by payment method, so that I can check my credit card statement.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Optional.
      options:
        - Contracts and costs
        - Master data
        - Documents and Paperless
        - Reminders and email
        - Sharing and users
        - AI assistant
        - Installation and updates
        - Other
