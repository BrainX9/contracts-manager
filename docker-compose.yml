# Contracts Manager – Docker Compose (no .env file needed)
#
# 1. Create a folder, e.g. /volume1/docker/contracts-manager, put this file
#    into it and create the subfolders db and media next to it.
# 2. Replace CHANGE_ME with a password of your own (letters and digits).
# 3. Start: docker compose up -d   (or create a project in the Synology
#    Container Manager with this file)
# 4. Open http://<address-of-your-server>:8010 – the app asks for the first
#    administrator.
#
# Keep this file private, it contains the database password. A "$" in a
# value must be written as "$$". More settings: docs/configuration.md
# (https://github.com/BrainX9/contracts-manager/blob/main/docs/configuration.md).

x-app-settings: &app-settings
  # --- Required ------------------------------------------------------------
  POSTGRES_DB: &db-name "contracts_db"
  POSTGRES_USER: &db-user "contracts_user"
  POSTGRES_PASSWORD: &db-password "CHANGE_ME"

  # --- Optional (remove the # to use a line) ---------------------------------
  # Host name(s) the app is reached at, comma separated (recommended)
  # ALLOWED_HOSTS: "contracts.example.com"
  # Only if a reverse proxy changes the address or the scheme
  # CSRF_TRUSTED_ORIGINS: "https://contracts.example.com"
  # True behind a reverse proxy with HTTPS
  # USE_HTTPS: "True"
  # User and group the app runs as (default 1000); the folders media and
  # config are given to this user automatically
  # APP_UID: "1000"
  # APP_GID: "1000"
  # Your own key; without it the app creates one in the folder config
  # SECRET_KEY: "a long random value, e.g. from: openssl rand -hex 32"

  MEDIA_ROOT: /app/media

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: contracts-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
    volumes:
      # create_host_path: false – the folder must exist; nothing is created
      # on an unencrypted volume if an encrypted folder is still locked
      - type: bind
        source: ./db
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: brainx9/contracts-manager:latest
    container_name: contracts-manager-app
    restart: unless-stopped
    ports:
      # Change the left number if port 8010 is taken on your server
      - "8010:8000"
    environment:
      <<: *app-settings
    depends_on:
      db:
        condition: service_healthy
    # Reach Ollama on the Docker host as host.docker.internal (optional)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./media
        target: /app/media
        bind:
          create_host_path: false
      # Generated key (secret_key); created automatically
      - ./config:/config
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8000
          && printf 'GET /health/ HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && read -r -t 5 line <&3
          && case "$$line" in *" 200 "*) exit 0;; *) exit 1;; esac
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: brainx9/contracts-manager:latest
    container_name: contracts-manager-worker
    restart: unless-stopped
    command: ["python", "manage.py", "qcluster"]
    environment:
      <<: *app-settings
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./media
        target: /app/media
        bind:
          create_host_path: false
      - ./config:/config
